name: Frontend CI

on:
  push:
    branches: [main, fix/staging-session-tab-isolation]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The repository currently has no committed package-lock.json.\n      - run: npm install
      - run: npm run test
      - run: npm run lint
      - run: npm run build
        env:
          # PRs and staging branches must never build against production backend.
          BACKEND_API_URL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'https://football-team-network.onrender.com' || 'https://football-team-network-staging.onrender.com' }}
