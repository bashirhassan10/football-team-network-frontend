name: Frontend CI

on:
  push:
    branches: [main, fix/staging-session-tab-isolation, chore/android-play-release-prep]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The repository currently has no committed package-lock.json.
      - run: npm install
      - run: npm run test
      - run: npm run lint
      - run: npm run build
        env:
          # PRs and staging branches must never build against production backend.
          BACKEND_API_URL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'https://football-team-network.onrender.com' || 'https://football-team-network-staging.onrender.com' }}

  android-twa:
    # Keep Android packaging limited to the isolated preparation branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/chore/android-play-release-prep'
    name: Generate and validate Android TWA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out isolated Android preparation branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.1.0"
          # Bubblewrap expects sdkmanager at $ANDROID_HOME/bin/sdkmanager.
          CMDLINE_TOOLS_DIR="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$CMDLINE_TOOLS_DIR/bin/sdkmanager"
          if [ ! -e "$ANDROID_HOME/bin" ]; then
            ln -s "$CMDLINE_TOOLS_DIR/bin" "$ANDROID_HOME/bin"
          fi
          test -x "$ANDROID_HOME/bin/sdkmanager"

      - name: Install Bubblewrap CLI
        run: npm install --global @bubblewrap/cli

      - name: Configure Bubblewrap toolchain
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          bubblewrap doctor

      - name: Generate the Android TWA project
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes expect
          expect <<'EXPECT_SCRIPT'
          set timeout 900
          spawn bubblewrap init --manifest=https://naijafootballnetwork.com/manifest.webmanifest --directory=android
          expect "Domain:"
          send "naijafootballnetwork.com\r"
          expect "URL path:"
          send "/\r"
          expect "Application name:"
          send "\r"
          expect "Short name:"
          send "\r"
          expect "Application ID:"
          send "com.naijafootballnetwork.app\r"
          expect "Starting version code"
          send "1\r"
          expect "Display mode:"
          send "\r"
          expect "Orientation:"
          send "\r"
          expect "Status bar color:"
          send "\r"
          expect "Splash screen color:"
          send "\r"
          expect "Icon URL:"
          send "\r"
          expect "Maskable icon URL:"
          send "\r"
          expect "Monochrome icon URL:"
          send "\r"
          expect "Include support for Play Billing?"
          send "n\r"
          expect "Request geolocation permission?"
          send "n\r"
          expect "Key store location:"
          send "\r"
          expect "Key name:"
          send "\r"
          expect "Do you want to create one now?"
          send "n\r"
          expect eof
          EXPECT_SCRIPT

      - name: Enforce Android API 36 in generated project
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("app/build.gradle")
          text = path.read_text()
          text, compile_count = re.subn(r"(compileSdkVersion|compileSdk)\s+\d+", r"\g<1> 36", text, count=1)
          text, target_count = re.subn(r"(targetSdkVersion|targetSdk)\s+\d+", r"\g<1> 36", text, count=1)
          if compile_count != 1 or target_count != 1:
              raise SystemExit("Could not safely set compileSdk and targetSdk to 36")
          path.write_text(text)
          PY

      - name: Verify application identity and Android API level
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle
          grep -F 'applicationId "com.naijafootballnetwork.app"' app/build.gradle
          grep -Eq 'compileSdkVersion 36|compileSdk 36' app/build.gradle
          grep -Eq 'targetSdkVersion 36|targetSdk 36' app/build.gradle

      - name: Build unsigned Android App Bundle
        working-directory: android
        run: bubblewrap build --skipSigning

      - name: Verify unsigned App Bundle exists
        run: test -s android/app-release-bundle.aab

      - name: Upload generated Android project and unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: nfn-android-twa-unsigned-${{ github.run_number }}
          path: |
            android/twa-manifest.json
            android/manifest-checksum.txt
            android/*.gradle
            android/gradle.properties
            android/gradlew
            android/gradlew.bat
            android/gradle/**
            android/app/build.gradle
            android/app/src/**
            android/app-release-bundle.aab
          if-no-files-found: error
          retention-days: 14
