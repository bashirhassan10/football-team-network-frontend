name: Frontend CI

on:
  push:
    branches: [main, fix/staging-session-tab-isolation, chore/android-play-release-prep]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The repository currently has no committed package-lock.json.
      - run: npm install
      - run: npm run test
      - run: npm run lint
      - run: npm run build
        env:
          # PRs and staging branches must never build against production backend.
          BACKEND_API_URL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'https://football-team-network.onrender.com' || 'https://football-team-network-staging.onrender.com' }}

  android-twa:
    # Keep Android packaging limited to the isolated preparation branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/chore/android-play-release-prep'
    name: Generate and validate Android TWA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out isolated Android preparation branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK components
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Bubblewrap CLI
        run: npm install --global @bubblewrap/cli

      - name: Configure Bubblewrap toolchain
        run: |
          bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$ANDROID_HOME"
          bubblewrap doctor

      - name: Generate the Android TWA project
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade

      - name: Verify application identity and Android API level
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle
          grep -F 'applicationId "com.naijafootballnetwork.app"' app/build.gradle
          grep -Eq 'compileSdkVersion 36|compileSdk 36' app/build.gradle
          grep -Eq 'targetSdkVersion 36|targetSdk 36' app/build.gradle

      - name: Build unsigned Android App Bundle
        working-directory: android
        run: bubblewrap build --skipSigning

      - name: Verify unsigned App Bundle exists
        run: test -s android/app-release-bundle.aab

      - name: Upload generated Android project and unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: nfn-android-twa-unsigned-${{ github.run_number }}
          path: |
            android/twa-manifest.json
            android/manifest-checksum.txt
            android/*.gradle
            android/gradle.properties
            android/gradlew
            android/gradlew.bat
            android/gradle/**
            android/app/build.gradle
            android/app/src/**
            android/app-release-bundle.aab
          if-no-files-found: error
          retention-days: 14
